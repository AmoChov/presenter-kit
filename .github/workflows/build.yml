name: Build & Release PresenterKit

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare distribution package
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/presenter-kit.exe dist/
          cp settings.toml dist/
          cd dist
          tar -a -c -f ../presenter-kit-windows.zip *

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: presenter-kit-windows
          path: |
            dist/presenter-kit.exe
            dist/settings.toml
            presenter-kit-windows.zip
          retention-days: 30

      - name: Create GitHub Release (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/presenter-kit.exe
            presenter-kit-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
